name: Album API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/album-api
  IMAGE_TAG: ${{ github.run_id }}
  AKS_NAMESPACE: dev

jobs:
  test-api:
    name: Test album-api
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore albums-api/albums-api.csproj

      - name: Run tests
        run: dotnet test albums-api/albums-api.csproj --configuration Release --no-restore

  build-and-push:
    name: Build and push image
    needs: test-api
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build album-api image
        uses: docker/build-push-action@v5
        with:
          context: ./albums-api
          file: ./albums-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy-to-aks:
    name: Deploy to dev AKS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy image to AKS
        run: |
          kubectl apply -f k8s/album-api-deployment.yaml -n ${{ env.AKS_NAMESPACE }}
          kubectl set image deployment/album-api album-api=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -n ${{ env.AKS_NAMESPACE }}
          kubectl rollout status deployment/album-api -n ${{ env.AKS_NAMESPACE }} --timeout=180s
